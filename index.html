<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>本地微博</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">微</span>
          <h1>本地微博</h1>
        </div>
        <div class="topbar-copy">
          <p>记录此刻，保存在当前浏览器。</p>
        </div>
      </header>

      <div class="layout">
        <aside class="profile-panel" aria-label="当前用户">
          <div class="profile-card">
            <div class="profile-avatar" aria-hidden="true">我</div>
            <div>
              <strong>我的主页</strong>
              <span>本地账号</span>
            </div>
          </div>
          <p>所有动态只保存在这台设备的浏览器里。</p>
        </aside>

        <div class="main-column">
          <section class="composer" aria-labelledby="composer-title">
            <div class="section-title">
              <h2 id="composer-title">发布动态</h2>
              <span>最多 280 字</span>
            </div>
            <form id="postForm">
              <label class="sr-only" for="postContent">动态内容</label>
              <textarea
                id="postContent"
                name="content"
                maxlength="280"
                rows="4"
                placeholder="分享一点新鲜事..."
                required
              ></textarea>
              <div class="composer-actions">
                <span id="counter" class="counter">0 / 280</span>
                <button type="submit">发布</button>
              </div>
            </form>
          </section>

          <section class="feed" aria-labelledby="feed-title">
            <div class="feed-header">
              <div class="section-title">
                <h2 id="feed-title">动态列表</h2>
                <span>本地动态</span>
              </div>
              <button id="clearAll" class="secondary" type="button">清空</button>
            </div>
            <div id="emptyState" class="empty">还没有动态，先发布一条。</div>
            <ul id="postList" class="post-list"></ul>
          </section>
        </div>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
